name: BeeBlend SEO audit
on:
  push:
    branches: [seo-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium && python tools/cro.py
      - run: |
          mkdir -p /tmp/o && mv cro.json m_*.jpg /tmp/o/ && git config user.name "BeeBlend bot" && git config user.email "actions@users.noreply.github.com"
          git checkout --orphan cro-output && git rm -rq --cached . && rm -rf ./* .github tools
          cp /tmp/o/* . && git add cro.json m_*.jpg && git commit -qm "SEO audit $(date -u +%F)" && git push -f origin cro-output
