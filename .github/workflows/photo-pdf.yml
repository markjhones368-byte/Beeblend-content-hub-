name: BeeBlend SEO audit
on:
  push:
    branches: [seo-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pillow && python tools/thumbs.py
      - run: |
          mkdir -p /tmp/o && mv thumbs_*.jpg /tmp/o/ && git config user.name "BeeBlend bot" && git config user.email "actions@users.noreply.github.com"
          git checkout --orphan thumbs-output && git rm -rq --cached . && rm -rf ./* .github tools
          cp /tmp/o/* . && git add thumbs_*.jpg && git commit -qm "SEO audit $(date -u +%F)" && git push -f origin thumbs-output
