name: BeeBlend photo export
on:
  push:
    branches: [photo-pdf]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/photo_files.py && du -sh photos && find photos -type f | wc -l
      - name: Save photos to the photo-files-output branch
        run: |
          mv photos /tmp/photos
          git config user.name "BeeBlend bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan photo-files-output
          git rm -rq --cached . ; rm -rf ./* .github tools
          cp -r /tmp/photos .
          git add photos && git commit -qm "BeeBlend website photos (original resolution)"
          git push -f origin photo-files-output
