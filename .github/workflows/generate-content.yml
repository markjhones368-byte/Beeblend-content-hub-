name: Generate content drafts

on:
  schedule:
    - cron: "0 8 * * 1"   # every Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "How many posts to draft"
        default: "3"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_content.py --count "${{ github.event.inputs.count || '3' }}"

      - name: Open a PR with the new drafts
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "New content drafts for review"
          title: "New Instagram post drafts — review & merge to approve"
          body: |
            Auto-generated captions are in `output/pending/`.
            - Edit any file directly in this PR to change wording.
            - Delete a file from the PR to reject that draft.
            - **Merge this PR to approve** — approved posts publish automatically.
          branch: content-drafts/${{ github.run_id }}
          base: main
