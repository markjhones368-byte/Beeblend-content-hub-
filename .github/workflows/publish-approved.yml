name: Publish approved drafts

on:
  push:
    branches: [main]
    paths:
      - "output/pending/**.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Move pending to approved
        run: |
          mkdir -p output/approved
          for f in output/pending/*.json; do
            [ -e "$f" ] || continue
            mv "$f" output/approved/
          done

      - name: Publish each approved draft to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/products/images
        run: |
          for f in output/approved/*.json; do
            [ -e "$f" ] || continue
            echo "Publishing $f"
            python scripts/publish_to_instagram.py "$f"
          done

      - name: Commit published-state changes
        run: |
          git config user.name "beeblend-content-bot"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "Mark drafts as published" || echo "Nothing to commit"
          git push
