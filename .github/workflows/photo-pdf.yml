name: BeeBlend photo PDF
on:
  push:
    branches: [photo-pdf]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow reportlab
      - run: python tools/photo_pdf.py
      - name: Save PDF to the photo-pdf-output branch
        run: |
          ls -la BeeBlend-website-photos.pdf
          mkdir /tmp/out && cp BeeBlend-website-photos.pdf /tmp/out/
          git config user.name "BeeBlend bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan photo-pdf-output
          git rm -rq --cached . ; rm -rf ./* .github tools
          cp /tmp/out/BeeBlend-website-photos.pdf .
          git add BeeBlend-website-photos.pdf
          git commit -qm "BeeBlend website photos PDF"
          git push -f origin photo-pdf-output
